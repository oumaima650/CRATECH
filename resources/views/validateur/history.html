<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3B82F6">
    <title>CRATECH - Historique des CRA (Validateur)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="admin-container">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <div class="logo-section">
                <div class="logo-icon">C</div>
                <span class="logo-text">CRATECH</span>
            </div>
            <div class="admin-badge employe-badge">
                <i class="fas fa-check-double"></i>
                <span>Validateur</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <h3 class="nav-section-title">Mon Espace</h3>
                <a href="/validateur/dashboard" class="nav-item">
                    <i class="fas fa-clipboard-check"></i>
                    <span>Validation des CRA</span>
                </a>
                <a href="/validateur/history" class="nav-item active">
                    <i class="fas fa-history"></i>
                    <span>Historique des CRA</span>
                </a>
                <a href="/validateur/assigned" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Utilisateurs assignés</span>
                </a>
            </div>
            <div class="nav-section">
                <h3 class="nav-section-title">Compte</h3>
                <a href="/validateur/account.html" class="nav-item">
                    <i class="fas fa-user-cog"></i>
                    <span>Mon Compte</span>
                </a>
                <a href="/logout" class="nav-item">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <div class="header-left">
                <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
                <div class="breadcrumb">
                    <i class="fas fa-history"></i>
                    <span>Historique des CRA</span>
                </div>
            </div>
            <div class="header-right">
                <div class="current-time"><i class="fas fa-clock"></i><span id="current-time"></span></div>
                <div class="user-menu">
                    <button class="user-menu-trigger">
                        <div class="user-avatar"><i class="fas fa-user"></i></div>
                        <span class="user-name" id="headerUserName">Validateur</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="dashboard-content">
            <div class="dashboard-card">
                <div class="card-header">
                    <h2 class="card-title"><i class="fas fa-list"></i> Historique des CRA validés/refusés</h2>
                    <button class="card-action" id="refreshHistory" title="Rafraîchir"><i class="fas fa-sync-alt"></i></button>
                </div>
                <div class="card-content">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                            <tr>
                                <th>Utilisateur</th>
                                <th>Mois</th>
                                <th>Statut</th>
                                <th>Action le</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody id="historyTableBody">
                            <tr><td colspan="5"><em>Chargement...</em></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/js/admin.js"></script>
<script>
    function updateTime(){
        const el = document.getElementById('current-time');
        if (el) el.textContent = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    }
    setInterval(updateTime, 1000); document.addEventListener('DOMContentLoaded', updateTime);

    async function loadHeaderUser(){
        try { const res = await fetch('/account/me',{credentials:'same-origin'}); const data=await res.json(); if(data&&data.success&&data.user){ const n=data.user.nom||data.user.name||'Validateur'; const el=document.getElementById('headerUserName'); if(el) el.textContent=n; } } catch(e){}
    }

    function renderHistory(items){
        const body = document.getElementById('historyTableBody');
        if (!body) return; body.innerHTML = '';
        if (!items || items.length=== 0){ body.innerHTML = '<tr><td colspan="5"><em>Aucun historique</em></td></tr>'; return; }
        items.forEach(row=>{
            const d=new Date(row.dateMois); const monthStr=d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
            const actionAt=row.actionAt? new Date(row.actionAt).toLocaleString('fr-FR'):'';
            const badge=row.status==='valide'?'success':'danger'; const label=row.status==='valide'?'Validé':'Refusé';
            const monthIndex=d.getMonth(); const year=d.getFullYear();
            body.innerHTML += `
                <tr>
                    <td>${row.user?.nom_user||''}</td>
                    <td>${monthStr}</td>
                    <td><span class="status-badge ${badge}">${label}</span></td>
                    <td>${actionAt}</td>
                    <td><a class="btn btn-secondary btn-small" href="/validateur/voir-cra.html?cra=${row.cra_id}&month=${monthIndex}&year=${year}"><i class="fas fa-eye"></i> Voir</a></td>
                </tr>`;
        });
    }

    async function loadHistory(){
        try { const res = await fetch('/validateur/api/history',{credentials:'same-origin'}); const payload=await res.json(); renderHistory(payload&&payload.success?payload.history:[]); } catch(e){ renderHistory([]); }
    }

    document.addEventListener('DOMContentLoaded', function(){
        loadHeaderUser();
        loadHistory();
        const btn = document.getElementById('refreshHistory');
        if (btn) btn.addEventListener('click', async function(){ btn.classList.add('spinning'); await loadHistory(); setTimeout(()=>btn.classList.remove('spinning'),300); });
    });
</script>
</body>
</html>
