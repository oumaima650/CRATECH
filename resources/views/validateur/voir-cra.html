<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3B82F6">
    <title>CRATECH - Voir CRA (Validateur)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-section">
                    <img src="/images/image.png" alt="CRATECH Logo" class="logo-icon">
                    <span class="logo-text">CRATECH</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3 class="nav-section-title">Mon Espace</h3>
                    <a href="/validateur/dashboard" class="nav-item">
                        <i class="fas fa-clipboard-check"></i>
                        <span>Validation des CRA</span>
                    </a>
                    <a href="/validateur/history" class="nav-item active">
                        <i class="fas fa-history"></i>
                        <span>Historique des CRA</span>
                    </a>
                    <a href="/validateur/assigned" class="nav-item">
                        <i class="fas fa-users"></i>
                        <span>Utilisateurs assignés</span>
                    </a>
                </div>

                <div class="nav-section">
                    <h3 class="nav-section-title">Compte</h3>
                    <a href="/validateur/account.html" class="nav-item">
                        <i class="fas fa-user-cog"></i>
                        <span>Mon Compte</span>
                    </a>
                    <a href="/logout" class="nav-item">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Déconnexion</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">Voir CRA</h1>
                </div>
                <div class="header-right">
                    <div class="current-time">
                        <i class="fas fa-clock"></i>
                        <span id="current-time"></span>
                    </div>
                </div>
            </header>

            <!-- CRA Content -->
            <div class="cra-content" id="craContent">
                <!-- Header Card -->
                <div class="cra-header-card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i class="fas fa-calendar-alt"></i>
                            <span id="craTitle">Compte Rendu d'Activité</span>
                        </h2>
                        <div class="cra-controls">
                            <a href="/validateur/history" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i>
                                Retour à la liste
                            </a>
                        </div>
                    </div>
                </div>

                <!-- CRA Table Card -->
                <div class="calendar-card">
                    <div class="cra-table-container">
                        <table id="craTable" class="cra-table">
                            <thead>
                                <tr id="craTableHeader">
                                    <th class="project-header">Projet</th>
                                    <!-- Jours générés dynamiquement -->
                                </tr>
                            </thead>
                            <tbody id="craTableBody">
                                <!-- Lignes projet générées dynamiquement -->
                            </tbody>
                        </table>
                    </div>

                    <div class="cra-actions">
                        <button class="btn btn-secondary btn-lg" id="exportCRA">
                            <i class="fas fa-download"></i>
                            Exporter
                        </button>
                        <div class="cra-status-info" id="craStatusInfo">
                            <!-- Statut du CRA -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <input type="hidden" id="csrf-token" value="">

    <!-- Scripts -->
    <script>
        // Sidebar Toggle
        document.addEventListener('DOMContentLoaded', function () {
            const toggle = document.querySelector('.sidebar-toggle');
            const sidebar = document.querySelector('.admin-sidebar');
            if (toggle && sidebar) {
                toggle.addEventListener('click', () => sidebar.classList.toggle('open'));
            }
        });

        // Horloge
        function updateTime() {
            const el = document.getElementById('current-time');
            if (el) el.textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateTime, 1000);

        async function loadHeaderUser() {
            try {
                const res = await fetch('/account/me', { credentials: 'same-origin' });
                const data = await res.json();
                if (data && data.success && data.user) {
                    const name = data.user.nom || data.user.name || 'Validateur';
                    const el = document.getElementById('headerUserName');
                    if (el) el.textContent = name;
                }
            } catch (e) { }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateTime();
            loadHeaderUser();
        });
    </script>
    <script src="/js/voir-cra.js"></script>
</body>

</html>
