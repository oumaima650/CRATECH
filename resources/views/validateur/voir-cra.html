<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3B82F6">
    <title>CRATECH - Voir CRA (Validateur)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-section">
                    <div class="logo-icon">C</div>
                    <span class="logo-text">CRATECH</span>
                </div>
                <div class="admin-badge employe-badge">
                    <i class="fas fa-check-double"></i>
                    <span>Validateur</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3 class="nav-section-title">Mon Espace</h3>
                    <a href="/validateur/dashboard" class="nav-item">
                        <i class="fas fa-clipboard-check"></i>
                        <span>Validation des CRA</span>
                    </a>
                </div>

                <div class="nav-section">
                    <h3 class="nav-section-title">Compte</h3>
                    <a href="/validateur/account.html" class="nav-item">
                        <i class="fas fa-user-cog"></i>
                        <span>Mon Compte</span>
                    </a>
                    <a href="/logout" class="nav-item">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Déconnexion</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb">
                        <i class="fas fa-eye"></i>
                        <span>Voir CRA</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="current-time">
                        <i class="fas fa-clock"></i>
                        <span id="current-time"></span>
                    </div>
                    <div class="user-menu">
                        <button class="user-menu-trigger">
                            <div class="user-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <span class="user-name" id="headerUserName">Validateur</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- CRA Content -->
            <div class="cra-content" id="craContent">
                <!-- Header Card -->
                <div class="cra-header-card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i class="fas fa-calendar-alt"></i>
                            <span id="craTitle">Compte Rendu d'Activité</span>
                        </h2>
                        <div class="cra-controls">
                            <a href="/validateur/dashboard" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i>
                                Retour au Dashboard
                            </a>
                        </div>
                    </div>
                </div>

                <!-- CRA Table Card -->
                <div class="calendar-card">
                    <div class="cra-table-container">
                        <table id="craTable" class="cra-table">
                            <thead>
                                <tr id="craTableHeader">
                                    <th class="project-header">Projet</th>
                                    <!-- Jours générés dynamiquement -->
                                </tr>
                            </thead>
                            <tbody id="craTableBody">
                                <!-- Lignes projet générées dynamiquement -->
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="cra-actions">
                        <button class="btn btn-secondary btn-lg" id="exportCRA">
                            <i class="fas fa-download"></i>
                            Exporter
                        </button>
                        <div class="cra-status-info" id="craStatusInfo">
                            <!-- Statut du CRA -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <input type="hidden" id="csrf-token" value="">

    <script src="/js/admin.js"></script>
    <script src="/js/voir-cra.js"></script>
</body>
</html>
