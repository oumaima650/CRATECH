<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3B82F6">
    <title>CRATECH - Utilisateurs assignés (Validateur)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .users-table th,
        .users-table td {
            text-align: left !important;
            padding: 1.25rem !important;
        }

        .status-badge {
            padding: 0.5rem 1rem !important;
            border-radius: 8px !important;
            font-size: 0.8rem !important;
            font-weight: 600 !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
        }

        .status-badge.success {
            background: rgba(16, 185, 129, 0.1) !important;
            color: #059669 !important;
        }

        .status-badge.warning {
            background: rgba(245, 158, 11, 0.1) !important;
            color: #d97706 !important;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-section">
                    <img src="/images/image.png" alt="CRATECH Logo" class="logo-icon">
                    <span class="logo-text">CRATECH</span>
                </div>

            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3 class="nav-section-title">Mon Espace</h3>
                    <a href="/validateur/dashboard" class="nav-item">
                        <i class="fas fa-clipboard-check"></i>
                        <span>Validation des CRA</span>
                    </a>
                    <a href="/validateur/history" class="nav-item">
                        <i class="fas fa-history"></i>
                        <span>Historique des CRA</span>
                    </a>
                    <a href="/validateur/assigned" class="nav-item active">
                        <i class="fas fa-users"></i>
                        <span>Utilisateurs assignés</span>
                    </a>
                </div>
                <div class="nav-section">
                    <h3 class="nav-section-title">Compte</h3>
                    <a href="/validateur/account.html" class="nav-item">
                        <i class="fas fa-user-cog"></i>
                        <span>Mon Compte</span>
                    </a>
                    <a href="/logout" class="nav-item">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Déconnexion</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">Utilisateur assignés</h1>
                </div>
                <div class="header-right">
                    <div class="current-time">
                        <i class="fas fa-clock"></i>
                        <span id="current-time"></span>
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="users-table-container">
                    <div class="table-header" style="justify-content: space-between;">
                        <h2 style="display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-users" style="color: var(--primary-blue);"></i>
                            Liste des utilisateurs assignés
                        </h2>
                        
                    </div>
                    <div class="table-wrapper">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>Nom & Email</th>
                                    <th>Statut</th>
                                    <th>CRA en attente</th>
                                    <th>Date de création</th>
                                </tr>
                            </thead>
                            <tbody id="assignedTableBody">
                                <tr>
                                    <td colspan="4" style="text-align: center; padding: 3rem; color: var(--gray-400);">
                                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                                        <p style="margin-top: 1rem;">Chargement des utilisateurs...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script>
        // Utilities & State
        function updateTime() {
            const el = document.getElementById('current-time');
            if (el) el.textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        async function loadHeaderUser() {
            try {
                const res = await fetch('/account/me', { credentials: 'same-origin' });
                const data = await res.json();
                if (data && data.success && data.user) {
                    const n = data.user.nom || data.user.name || 'Validateur';
                    const el = document.getElementById('headerUserName');
                    if (el) el.textContent = n;
                }
            } catch (e) { }
        }

        // UI Rendering
        function renderAssigned(items) {
            const body = document.getElementById('assignedTableBody');
            if (!body) return;
            body.innerHTML = '';

            if (!items || items.length === 0) {
                body.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 3rem; color: var(--gray-400);">Aucun collaborateur assigné</td></tr>';
                return;
            }

            items.forEach(u => {
                const badgeClass = u.status === 'actif' ? 'success' : 'warning';
                const statusLabel = u.status.charAt(0).toUpperCase() + u.status.slice(1);
                const createdAt = u.created_at ? new Date(u.created_at).toLocaleDateString('fr-FR') : '---';
                const userName = u.nom_user || 'Utilisateur';
                const userEmail = u.email_user || '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <div style="width: 40px; height: 40px; border-radius: 12px; background: var(--gray-100); color: var(--gray-500); display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <div style="display: flex; flex-direction: column;">
                                <span style="font-weight: 600; color: var(--gray-900);">${userName}</span>
                                <span style="font-size: 0.8rem; color: var(--gray-500);">${userEmail}</span>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="status-badge ${badgeClass}">
                            <i class="fas ${u.status === 'actif' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                            ${statusLabel}
                        </span>
                    </td>
                    <td>
                        <div style="display: flex; align-items: center; gap: 0.5rem; font-weight: 500; color: var(--gray-700);">
                            <i class="fas fa-clock" style="color: var(--warning);"></i>
                            ${u.pending || 0}
                        </div>
                    </td>
                    <td>
                        <div style="font-size: 0.85rem; color: var(--gray-600);">
                            <i class="far fa-calendar-alt" style="margin-right: 0.5rem; color: var(--primary-blue);"></i>
                            ${createdAt}
                        </div>
                    </td>
                `;
                body.appendChild(tr);
            });
        }

        // Data Loading
        async function loadAssigned() {
            try {
                const res = await fetch('/validateur/api/assigned-users', { credentials: 'same-origin' });
                const payload = await res.json();
                renderAssigned(payload && payload.success ? payload.users : []);
            } catch (e) {
                renderAssigned([]);
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', function () {
            // Sidebar Toggle
            const toggle = document.querySelector('.sidebar-toggle');
            const sidebar = document.querySelector('.admin-sidebar');
            if (toggle && sidebar) {
                toggle.addEventListener('click', () => sidebar.classList.toggle('open'));
            }

            // Time and User
            updateTime();
            setInterval(updateTime, 1000);
            loadHeaderUser();

            // Initial data load
            loadAssigned();

            // Refresh button
            const btn = document.getElementById('refreshAssigned');
            if (btn) {
                btn.addEventListener('click', async function () {
                    btn.classList.add('spinning');
                    await loadAssigned();
                    setTimeout(() => btn.classList.remove('spinning'), 300);
                });
            }
        });
    </script>
</body>

</html>
