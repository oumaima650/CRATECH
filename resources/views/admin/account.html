<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3B82F6">
    <title>CRATECH - Mon Compte (Administrateur)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .settings-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--gray-100);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .settings-header {
            padding: 2rem;
            background: linear-gradient(to right, var(--gray-50), white);
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .settings-avatar {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-violet));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
        }

        .settings-title-info h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--gray-900);
            font-weight: 700;
        }

        .settings-title-info p {
            margin: 0.25rem 0 0;
            color: var(--gray-500);
            font-size: 0.95rem;
        }

        .settings-body {
            padding: 2.5rem;
        }

        .form-section {
            margin-bottom: 2.5rem;
        }

        .form-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .form-section-title i {
            color: var(--primary-blue);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .form-group label {
            font-weight: 600;
            color: var(--gray-700);
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 0.875rem 1.25rem;
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--gray-50);
        }

        .form-group input:focus {
            background: white;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            outline: none;
        }

        .form-group input[readonly] {
            cursor: not-allowed;
            color: var(--gray-500);
        }

        .form-actions {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--gray-100);
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn {
            padding: 0.875rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: white;
            border: 1px solid var(--gray-200);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
        }

        .badge-role {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary-blue);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar fixe (Admin) -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-section">
                    <img src="/images/image.png" alt="CRATECH Logo" class="logo-icon">
                    <span class="logo-text">CRATECH</span>
                </div>
                <div class="admin-badge">
                    <i class="fas fa-crown"></i>
                    <span>Administrateur</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3 class="nav-section-title">Tableau de bord</h3>
                    <a href="/admin/dashboard.html" class="nav-item">
                        <i class="fas fa-chart-pie"></i>
                        <span>Vue d'ensemble</span>
                    </a>
                </div>
                <div class="nav-section">
                    <h3 class="nav-section-title">Gestion</h3>
                    <a href="/admin/users.html" class="nav-item">
                        <i class="fas fa-users"></i>
                        <span>Utilisateurs</span>
                    </a>
                    <a href="/admin/activities.html" class="nav-item">
                        <i class="fas fa-tasks"></i>
                        <span>Activité</span>
                    </a>
                    <a href="/admin/cra.html" class="nav-item">
                        <i class="fas fa-clipboard-list"></i>
                        <span>CRA</span>
                    </a>
                </div>

                <div class="nav-section">
                    <h3 class="nav-section-title">Compte</h3>
                    <a href="/admin/account.html" class="nav-item active">
                        <i class="fas fa-user-cog"></i>
                        <span>Mon Compte</span>
                    </a>
                    <a href="/logout" class="nav-item">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Déconnexion</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Contenu principal -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">Mon Compte</h1>
                </div>
                <div class="header-right">
                    <div class="current-time">
                        <i class="fas fa-clock"></i>
                        <span id="current-time"></span>
                    </div>
                </div>
            </header>

            <!-- Contenu compte -->
            <div class="dashboard-content" id="accountContent">
                <div class="settings-card">
                    <div class="settings-header">
                        <div class="settings-avatar">
                            <i class="fas fa-user-shield"></i>
                        </div>
                        <div class="settings-title-info">
                            <h2 id="displayUserName">Chargement...</h2>
                            <span class="badge-role">Administrateur</span>
                        </div>
                    </div>

                    <div class="settings-body">
                        <div id="alertSuccess" class="alert alert-success"
                            style="display: none; padding: 1rem; border-radius: 12px; margin-bottom: 2rem; background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0;">
                        </div>
                        <div id="alertError" class="alert alert-error"
                            style="display: none; padding: 1rem; border-radius: 12px; margin-bottom: 2rem; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;">
                        </div>

                        <form id="accountForm">
                            <div class="form-section">
                                <h3 class="form-section-title">
                                    <i class="fas fa-id-card"></i>
                                    Informations Personnelles
                                </h3>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label for="accountId">Identifiant unique</label>
                                        <input id="accountId" type="text" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="accountName">Nom complet</label>
                                        <input id="accountName" name="nom" type="text" placeholder="Entrez votre nom">
                                    </div>
                                    <div class="form-group">
                                        <label for="accountEmail">Adresse email</label>
                                        <input id="accountEmail" type="email" readonly>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section" style="margin-bottom: 0;">
                                <h3 class="form-section-title">
                                    <i class="fas fa-lock"></i>
                                    Sécurité
                                </h3>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label for="accountPassword">Nouveau mot de passe</label>
                                        <input id="accountPassword" name="password" type="password"
                                            placeholder="Laisser vide pour conserver l'actuel">
                                    </div>
                                    <div class="form-group">
                                        <label for="accountPasswordConfirm">Confirmer le mot de passe</label>
                                        <input id="accountPasswordConfirm" name="password_confirmation" type="password"
                                            placeholder="Retapez le mot de passe">
                                    </div>
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="button" id="btnCancel" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i>
                                    Annuler
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i>
                                    Enregistrer les modifications
                                </button>
                            </div>
                            <input type="hidden" id="csrf-token" value="">
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/admin.js"></script>
    <script>
        (function () {
            function updateTime() {
                const el = document.getElementById('current-time');
                if (el) el.textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            }
            setInterval(updateTime, 1000); document.addEventListener('DOMContentLoaded', updateTime);

            const els = {
                id: document.getElementById('accountId'),
                email: document.getElementById('accountEmail'),
                name: document.getElementById('accountName'),
                pass: document.getElementById('accountPassword'),
                pass2: document.getElementById('accountPasswordConfirm'),
                alertSuccess: document.getElementById('alertSuccess'),
                alertError: document.getElementById('alertError'),
                csrf: document.getElementById('csrf-token'),
                form: document.getElementById('accountForm'),
                btnCancel: document.getElementById('btnCancel'),
            };

            function showAlert(el, msg) { el.textContent = msg; el.style.display = 'block'; }
            function hideAlerts() { els.alertSuccess.style.display = 'none'; els.alertError.style.display = 'none'; }

            async function loadCSRF() {
                try {
                    const r = await fetch('/csrf-token', { credentials: 'same-origin' });
                    const j = await r.json();
                    els.csrf.value = j.token || '';
                } catch (e) { console.error('CSRF error', e); }
            }

            async function loadMe() {
                try {
                    const r = await fetch('/account/me', {
                        credentials: 'same-origin',
                        headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }
                    });
                    const j = await r.json();
                    if (!r.ok || !j.success) { throw new Error(j.message || 'Non connecté'); }
                    els.id.value = j.user.id_user || '';
                    els.email.value = j.user.email || j.user.email_user || '';
                    els.name.value = j.user.nom || '';

                    const displayUserName = document.getElementById('displayUserName');
                    if (displayUserName) displayUserName.textContent = j.user.nom || 'Administrateur';
                } catch (e) {
                    showAlert(els.alertError, 'Erreur: ' + e.message);
                }
            }

            els.form.addEventListener('submit', async function (e) {
                e.preventDefault(); hideAlerts();
                const payload = {};
                const nom = els.name.value.trim();
                if (nom) payload.nom = nom;
                const p1 = els.pass.value, p2 = els.pass2.value;
                if (p1 || p2) {
                    if (p1.length < 8) { showAlert(els.alertError, 'Le mot de passe doit contenir au moins 8 caractères'); return; }
                    if (p1 !== p2) { showAlert(els.alertError, 'Les mots de passe ne correspondent pas'); return; }
                    payload.password = p1; payload.password_confirmation = p2;
                }
                if (Object.keys(payload).length === 0) { showAlert(els.alertError, 'Aucune modification à enregistrer'); return; }
                try {
                    const r = await fetch('/account/update', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest',
                            'X-CSRF-TOKEN': els.csrf.value
                        },
                        body: JSON.stringify(payload)
                    });
                    const j = await r.json();
                    if (!r.ok || !j.success) { throw new Error(j.message || 'Échec de la mise à jour'); }
                    showAlert(els.alertSuccess, 'Compte mis à jour avec succès');
                    if (payload.nom) {
                        const displayUserName = document.getElementById('displayUserName');
                        if (displayUserName) displayUserName.textContent = payload.nom;
                    }
                    els.pass.value = ''; els.pass2.value = '';
                } catch (e) {
                    showAlert(els.alertError, 'Erreur: ' + e.message);
                }
            });

            els.btnCancel.addEventListener('click', function () {
                if (document.referrer) { window.history.back(); } else { window.location.href = '/admin/dashboard.html'; }
            });

            (async function init() {
                await loadCSRF();
                await loadMe();
            })();
        })();
    </script>
</body>

</html>
