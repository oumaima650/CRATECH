<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3B82F6">
    <title>CRATECH - Gestion des CRA (Admin)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-container">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <div class="logo-section">
                <div class="logo-icon">C</div>
                <span class="logo-text">CRATECH</span>
            </div>
            <div class="admin-badge">
                <i class="fas fa-crown"></i>
                <span>Administrateur</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <h3 class="nav-section-title">Tableau de bord</h3>
                <a href="/admin/dashboard.html" class="nav-item">
                    <i class="fas fa-chart-pie"></i>
                    <span>Vue d'ensemble</span>
                </a>
            </div>
            <div class="nav-section">
                <h3 class="nav-section-title">Gestion</h3>
                <a href="/admin/users.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Utilisateurs</span>
                </a>
                <a href="/admin/activities.html" class="nav-item">
                    <i class="fas fa-tasks"></i>
                    <span>Activité</span>
                </a>
                <a href="/admin/cra.html" class="nav-item active">
                    <i class="fas fa-clipboard-list"></i>
                    <span>CRA</span>
                </a>
            </div>
            <div class="nav-section">
                <h3 class="nav-section-title">Compte</h3>
                <a href="/admin/account.html" class="nav-item">
                    <i class="fas fa-user-cog"></i>
                    <span>Compte</span>
                </a>
                <a href="/logout" class="nav-item">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <!-- Header -->
        <header class="admin-header">
            <div class="header-left">
                <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
                <div class="breadcrumb">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Gestion des CRA</span>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="btnExport"><i class="fas fa-download"></i> Exporter</button>
                <button class="btn btn-secondary" id="btnRefresh"><i class="fas fa-sync-alt"></i> Actualiser</button>
            </div>
        </header>

        <!-- Content -->
        <div class="dashboard-content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-clock"></i></div>
                    <div class="stat-content">
                        <h3 class="stat-number" id="statPending" data-target="0">0</h3>
                        <p class="stat-label">En attente</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                    <div class="stat-content">
                        <h3 class="stat-number" id="statValidated" data-target="0">0</h3>
                        <p class="stat-label">Validés</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-times-circle"></i></div>
                    <div class="stat-content">
                        <h3 class="stat-number" id="statRejected" data-target="0">0</h3>
                        <p class="stat-label">Refusés</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-file-alt"></i></div>
                    <div class="stat-content">
                        <h3 class="stat-number" id="statTotal" data-target="0">0</h3>
                        <p class="stat-label">Total CRA</p>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="dashboard-card">
                <div class="card-header">
                    <h2 class="card-title"><i class="fas fa-filter"></i> Filtres</h2>
                </div>
                <div class="card-content">
                    <div class="filters-container">
                        <div class="filter-group">
                            <label for="fStatus">Statut</label>
                            <select id="fStatus" class="filter-select">
                                <option value="">Tous</option>
                                <option value="en_attente">En attente</option>
                                <option value="valide">Validé</option>
                                <option value="refuse">Refusé</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="fUser">Utilisateur</label>
                            <select id="fUser" class="filter-select">
                                <option value="">Tous</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="fSearch">Rechercher</label>
                            <input type="text" id="fSearch" class="filter-input" placeholder="ID CRA, utilisateur...">
                        </div>
                        <button class="btn btn-secondary" id="btnClear"><i class="fas fa-times"></i> Effacer</button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="dashboard-card">
                <div class="card-header">
                    <h2 class="card-title"><i class="fas fa-table"></i> Liste des CRA</h2>
                </div>
                <div class="card-content">
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID CRA</th>
                                    <th>Utilisateur</th>
                                    <th>Période</th>
                                    <th>Statut</th>
                                    <th>Créé le</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="craTbody">
                                <tr>
                                    <td colspan="6" class="loading-row">
                                        <div class="loading-state"><i class="fas fa-spinner fa-spin"></i><span> Chargement des CRA...</span></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination-container" id="pagination"></div>
                </div>
            </div>
        </div>
    </main>
</div>



<script src="/js/admin.js"></script>
<script>
    // Etat global
    const state = {
        csrf: '',
        page: 1,
        lastPage: 1,
        total: 0,
        from: 0,
        to: 0,
        rows: [], // données brutes du backend (c_r_a_s)
        filters: { status: '', user: '', search: '' },
        pendingAction: { type: null, id: null }
    };

    document.addEventListener('DOMContentLoaded', () => {
        const bind = (id, evt, handler) => { const el = document.getElementById(id); if (el) el.addEventListener(evt, handler); };
        // Liens UI
        bind('btnRefresh','click', () => loadPage(state.page));
        bind('btnExport','click', exportCSV);
        bind('btnClear','click', clearFilters);
        bind('fStatus','change', e => { state.filters.status = e.target.value; applyFilters(); });
        bind('fUser','change', e => { state.filters.user = e.target.value; applyFilters(); });
        bind('fSearch','input', e => { state.filters.search = e.target.value.toLowerCase(); applyFilters(); });

        // Modal
        bind('modalClose','click', closeModal);
        bind('modalCancel','click', closeModal);
        bind('modalConfirm','click', confirmAction);

        // Démarrage
        fetchCsrf().finally(() => loadPage(1));
    });

    async function fetchCsrf() {
        try {
            const res = await fetch('/csrf-token', { credentials: 'same-origin' });
            const data = await res.json();
            state.csrf = data.token || '';
        } catch (_) {}
    }

    async function loadPage(page = 1) {
        showLoading();
        try {
            // Fallback d'URLs pour minimiser les erreurs de route
            const paths = [
                `/admin/api/cra?page=${page}`,
                `/api/cra?page=${page}`
            ];
            const json = await fetchWithFallback(paths);
            const norm = normalize(json);

            state.page = norm.pagination.current_page;
            state.lastPage = norm.pagination.last_page;
            state.total = norm.pagination.total;
            state.from = norm.pagination.from;
            state.to = norm.pagination.to;
            state.rows = norm.cras; // uniquement table c_r_a_s (+ utilisateur)

            renderUsersFilter(state.rows);
            renderTable(state.rows);
            renderPagination();
            updateStats(state.rows);
        } catch (err) {
            renderError('Erreur lors du chargement des CRA');
            console.error(err);
        }
    }

    async function fetchWithFallback(urls) {
        let lastErr;
        for (const u of urls) {
            try {
                const res = await fetch(u, { headers: { 'Accept': 'application/json' }, credentials: 'same-origin' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            } catch (e) { lastErr = e; }
        }
        throw lastErr || new Error('Aucune route API valide');
    }

    function normalize(json) {
        // Accepte formats: {cras:[...], pagination:{...}} ou Laravel paginator
        let cras = [];
        let pagination = { current_page: 1, last_page: 1, total: 0, from: 0, to: 0 };

        if (Array.isArray(json.cras)) {
            cras = json.cras;
            if (json.pagination) pagination = json.pagination;
        } else if (Array.isArray(json.data)) {
            cras = json.data;
            pagination = {
                current_page: json.current_page || 1,
                last_page: json.last_page || 1,
                total: json.total || cras.length,
                from: json.from || 1,
                to: json.to || cras.length
            };
        } else if (json && json.cras && json.cras.data) {
            cras = json.cras.data;
            const p = json.cras;
            pagination = {
                current_page: p.current_page || 1,
                last_page: p.last_page || 1,
                total: p.total || cras.length,
                from: p.from || 1,
                to: p.to || cras.length
            };
        }
        return { cras, pagination };
    }

    function renderUsersFilter(rows) {
        const select = document.getElementById('fUser');
        const names = new Set();
        rows.forEach(r => { if (r.utilisateur && r.utilisateur.nom_user) names.add(r.utilisateur.nom_user); });
        const current = select.value;
        select.innerHTML = '<option value="">Tous</option>' + Array.from(names).sort().map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
        if (names.has(current)) select.value = current; else select.value = '';
    }

    function renderTable(rows) {
        const tbody = document.getElementById('craTbody');
        if (!rows || rows.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="empty-state"><i class="fas fa-file-alt"></i> Aucun CRA</td></tr>`;
            return;
        }
        const html = rows.map(r => {
            const id = r.id_CRA;
            const userName = r.utilisateur?.nom_user || 'N/A';
            const userEmail = r.utilisateur?.email_user || '';
            const period = formatMonthYear(r.dateMois);
            const statusKey = r.status || '';
            const statusText = getStatusText(statusKey);
            const createdAt = formatDateTime(r.created_at);
            const pending = statusKey === 'en_attente';
            return `<tr>
                <td><span class="id-number">#${escapeHtml(id)}</span></td>
                <td>
                    <div class="user-info">
                        <div class="user-avatar"><i class="fas fa-user"></i></div>
                        <div class="user-details">
                            <span class="user-name">${escapeHtml(userName)}</span>
                            <span class="user-email">${escapeHtml(userEmail)}</span>
                        </div>
                    </div>
                </td>
                <td><span class="period-month">${escapeHtml(period)}</span></td>
                <td><span class="status-badge status-${escapeHtml(statusKey)}">${escapeHtml(statusText)}</span></td>
                <td><span class="date-created">${escapeHtml(createdAt)}</span></td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-action btn-view" title="Voir" onclick="viewCra(${id})"><i class="fas fa-eye"></i></button>
                        ${pending ? `<button class="btn-action btn-validate" title="Valider" onclick="openAction('validate', ${id})"><i class="fas fa-check"></i></button>` : ''}
                        ${pending ? `<button class="btn-action btn-reject" title="Refuser" onclick="openAction('reject', ${id})"><i class="fas fa-times"></i></button>` : ''}
                    </div>
                </td>
            </tr>`;
        }).join('');
        tbody.innerHTML = html;
        applyFilters();
    }

    function renderPagination() {
        const el = document.getElementById('pagination');
        if (state.lastPage <= 1) { el.innerHTML = ''; return; }
        let html = `<div class="pagination-info">Affichage de ${state.from} à ${state.to} sur ${state.total} CRA</div><div class="pagination-links">`;
        if (state.page > 1) html += `<button class="pagination-btn" onclick="loadPage(${state.page - 1})">Précédent</button>`;
        for (let i=1;i<=state.lastPage;i++) html += `<button class="pagination-btn ${i===state.page?'active':''}" onclick="loadPage(${i})">${i}</button>`;
        if (state.page < state.lastPage) html += `<button class="pagination-btn" onclick="loadPage(${state.page + 1})">Suivant</button>`;
        html += '</div>';
        el.innerHTML = html;
    }

    function updateStats(rows) {
        const pending = rows.filter(r => r.status === 'en_attente').length;
        const validated = rows.filter(r => r.status === 'valide').length;
        const rejected = rows.filter(r => r.status === 'refuse').length;
        document.getElementById('statPending').textContent = pending;
        document.getElementById('statValidated').textContent = validated;
        document.getElementById('statRejected').textContent = rejected;
        document.getElementById('statTotal').textContent = state.total || rows.length;
    }

    // Filtres client
    function applyFilters() {
        const rows = Array.from(document.querySelectorAll('#craTbody tr'));
        const { status, user, search } = state.filters;
        rows.forEach(tr => {
            const tds = tr.children;
            if (!tds || tds.length < 6) return;
            const idText = (tds[0].textContent || '').toLowerCase();
            const userText = (tds[1].textContent || '').toLowerCase();
            const statusText = (tds[3].textContent || '').toLowerCase();
            const matchStatus = !status || statusText.includes(status);
            const matchUser = !user || userText.includes(user.toLowerCase());
            const matchSearch = !search || userText.includes(search) || idText.includes(search);
            tr.style.display = (matchStatus && matchUser && matchSearch) ? '' : 'none';
        });
    }

    function clearFilters() {
        state.filters = { status: '', user: '', search: '' };
        document.getElementById('fStatus').value = '';
        document.getElementById('fUser').value = '';
        document.getElementById('fSearch').value = '';
        applyFilters();
    }

    // Actions
    function viewCra(id) { window.location.href = `/admin/cra/${id}/view`; }
    window.viewCra = viewCra;

    function openAction(type, id) {
        state.pendingAction = { type, id };
        document.getElementById('modalTitle').textContent = type === 'validate' ? 'Valider le CRA' : 'Refuser le CRA';
        document.getElementById('modalMsg').textContent = type === 'validate' ? 'Confirmer la validation de ce CRA ?' : 'Confirmer le refus de ce CRA ?';
        openModal();
    }
    window.openAction = openAction;

    function openModal(){ document.getElementById('modal').style.display = 'block'; }
    function closeModal(){ document.getElementById('modal').style.display = 'none'; state.pendingAction = { type:null,id:null }; }

    async function confirmAction() {
        const { type, id } = state.pendingAction || {};
        if (!type || !id) return;
        const endpoint = type === 'validate' ? 'validate' : 'reject';
        const paths = [
            `/admin/cra/${id}/${endpoint}`,
            `/cra/${id}/${endpoint}`,
            `/validateur/api/cra/${id}/${endpoint}`
        ];
        try {
            let lastErr;
            for (const p of paths) {
                try {
                    const res = await fetch(p, {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json', 'X-CSRF-TOKEN': state.csrf || '' }
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const payload = await res.json().catch(() => ({ success: true }));
                    if (payload.success === false) throw new Error(payload.message || 'Action échouée');
                    closeModal();
                    await loadPage(state.page);
                    return;
                } catch (e) { lastErr = e; }
            }
            alert((lastErr && lastErr.message) || 'Action échouée');
        } catch (e) {
            alert('Erreur lors de l\'action');
        }
    }

    // Export CSV des lignes visibles
    function exportCSV() {
        const rows = Array.from(document.querySelectorAll('#craTbody tr')).filter(tr => tr.style.display !== 'none');
        if (!rows.length) { alert('Aucune donnée à exporter'); return; }
        const header = ['ID CRA','Utilisateur','Email','Période','Statut','Créé le'];
        const data = rows.map(tr => {
            const tds = tr.children;
            return [
                (tds[0].textContent || '').trim(),
                (tds[1].querySelector('.user-name')?.textContent || '').trim(),
                (tds[1].querySelector('.user-email')?.textContent || '').trim(),
                (tds[2].textContent || '').trim(),
                (tds[3].textContent || '').trim(),
                (tds[4].textContent || '').trim()
            ];
        });
        const csv = [header, ...data].map(row => row.map(v => {
            const s = String(v ?? '');
            return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
        }).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `cras-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    // Helpers
    function showLoading(){ document.getElementById('craTbody').innerHTML = `<tr><td colspan="6" class="loading-row"><div class="loading-state"><i class="fas fa-spinner fa-spin"></i><span> Chargement des CRA...</span></div></td></tr>`; }
    function renderError(msg){ document.getElementById('craTbody').innerHTML = `<tr><td colspan="6" class="empty-state"><i class=\"fas fa-exclamation-triangle\"></i> ${escapeHtml(msg||'Erreur')}</td></tr>`; }
    function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }
    function getStatusText(k){ return ({'en_attente':'En attente','valide':'Validé','refuse':'Refusé'})[k] || k || ''; }
    function formatMonthYear(dateStr){ if(!dateStr) return 'N/A'; const d = new Date(dateStr); if(!isNaN(d)) return d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}); const p=String(dateStr).split('-'); if(p.length>=2){const y=+p[0],m=+p[1];if(!isNaN(y)&&!isNaN(m)){const dt=new Date(y,m-1,1);return dt.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});}} return String(dateStr); }
    function formatDateTime(dateStr){ if(!dateStr) return 'N/A'; const d = new Date(dateStr); return isNaN(d)? String(dateStr): d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
</script>

<style>
    .filters-container{display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end}
    .filter-group{display:flex;flex-direction:column;gap:.25rem}
    .filter-select,.filter-input{padding:.5rem .75rem;border:1px solid #e5e7eb;border-radius:.5rem;min-width:200px}
    .table-container{overflow:auto}
    .pagination-container{display:flex;align-items:center;justify-content:space-between;margin-top:1rem}
    .pagination-links{display:flex;gap:.5rem;flex-wrap:wrap}
    .pagination-btn{padding:.5rem .75rem;border:1px solid #e5e7eb;background:#fff;border-radius:.5rem;cursor:pointer}
    .pagination-btn.active{background:#3B82F6;color:#fff;border-color:#3B82F6}
    .btn-action{width:32px;height:32px;border:none;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.875rem}
    .btn-view{background:#E5E7EB;color:#374151}
    .btn-validate{background:#D1FAE5;color:#065F46}
    .btn-reject{background:#FEE2E2;color:#991B1B}
</style>
</body>
</html>
