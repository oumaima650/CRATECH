<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3B82F6">
    <title>CRATECH - Créer une Activité</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-section">
                    <img src="/images/image.png" alt="CRATECH Logo" class="logo-icon">
                    <span class="logo-text">CRATECH</span>
                </div>
                <div class="admin-badge">
                    <i class="fas fa-crown"></i>
                    <span>Administrateur</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3 class="nav-section-title">Tableau de bord</h3>
                    <a href="/admin/dashboard.html" class="nav-item ">
                        <i class="fas fa-chart-pie"></i>
                        <span>Vue d'ensemble</span>
                    </a>
                </div>

                <div class="nav-section">
                    <h3 class="nav-section-title">Gestion</h3>
                    <a href="/admin/users.html" class="nav-item">
                        <i class="fas fa-users"></i>
                        <span>Utilisateurs</span>
                    </a>
                    <a href="/admin/activities.html" class="nav-item active">
                        <i class="fas fa-tasks"></i>
                        <span>Activité</span>
                    </a>
                    <a href="/admin/cra.html" class="nav-item">
                        <i class="fas fa-clipboard-list"></i>
                        <span>CRA</span>
                    </a>
                </div>

                <div class="nav-section">
                    <h3 class="nav-section-title">Compte</h3>
                    <a href="/admin/account.html" class="nav-item">
                        <i class="fas fa-user-cog"></i>
                        <span>Compte</span>
                    </a>
                    <a href="/login" class="nav-item">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Déconnexion</span>
                    </a>
                </div>
            </nav>

        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">Créer une Activité</h1>
                </div>
                <div class="header-right">

                    <div class="current-time">
                        <i class="fas fa-clock"></i>
                        <span id="current-time"></span>
                    </div>

                </div>
            </header>

            <div class="users-content" style="max-width:1100px;margin:0 auto;">
                <div class="users-table-container" style="overflow:visible;">
                    <div class="table-header" style="border-bottom:none;padding-bottom:0;">
                        <div style="display:flex;align-items:center;gap:.75rem;">
                            <div class="user-avatar-small" style="width:40px;height:40px;border-radius:10px;">
                                <i class="fas fa-tasks"></i>
                            </div>
                            <div>
                                <h2 style="margin:0;">Créer une nouvelle activité</h2>
                                <p style="margin:.25rem 0 0;color:var(--gray-600);">Renseignez les informations
                                    ci-dessous pour créer une nouvelle activité.</p>
                            </div>
                        </div>
                    </div>
                    <div class="table-wrapper" style="padding: 1.5rem;">
                        <form id="createActivityForm" class="form-grid"
                            style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
                            <input type="hidden" name="_token" id="csrf-token" value="">

                            <div class="form-row" style="grid-column:span 1;">
                                <label for="nom_act" style="font-weight:600;color:var(--gray-800);">Nom de
                                    l'activité</label>
                                <div style="position:relative;">
                                    <i class="fas fa-tag"
                                        style="position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--gray-400);"></i>
                                    <input style="padding-left:2.5rem;" type="text" id="nom_act" name="nom_act"
                                        placeholder="Ex: Développement Web, Marketing Digital..." required>
                                </div>
                            </div>

                            <div class="form-row" style="grid-column:span 1;">
                                <label for="status" style="font-weight:600;color:var(--gray-800);">Statut</label>
                                <select id="status" name="status" required>
                                    <option value="">Sélectionner un statut</option>
                                    <option value="actif" selected>Actif</option>
                                    <option value="inactif">Inactif</option>
                                </select>
                            </div>

                            <div class="form-row" style="grid-column:span 2;">
                                <label for="description"
                                    style="font-weight:600;color:var(--gray-800);">Description</label>
                                <textarea id="description" name="description" rows="4"
                                    placeholder="Décrivez cette activité en détail..."></textarea>
                            </div>

                            <div class="form-actions"
                                style="grid-column:span 2;display:flex;gap:1rem;justify-content:flex-end;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--gray-200);">
                                <button type="button" class="btn btn-secondary"
                                    onclick="window.location.href='/admin/activities.html'">
                                    <i class="fas fa-arrow-left"></i>
                                    <span>Retour à la liste</span>
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i>
                                    <span>Créer l'Activité</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/admin.js"></script>
    <script>
        // Initialisation du token CSRF
        document.addEventListener('DOMContentLoaded', function () {
            fetch('/csrf-token', { credentials: 'same-origin' })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('csrf-token').value = data.token || data.csrf_token || '';
                })
                .catch(error => {
                    console.error('Erreur lors de la récupération du token CSRF:', error);
                });
        });

        // Gestion du formulaire
        document.getElementById('createActivityForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;

            // Désactiver le bouton et afficher le loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Création...';

            // Nettoyer les erreurs précédentes
            clearFormErrors();

            fetch('/admin/activities', {
                method: 'POST',
                headers: {
                    'X-CSRF-TOKEN': document.getElementById('csrf-token').value,
                    'Accept': 'application/json',
                },
                body: formData,
                credentials: 'same-origin'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showSuccessMessage('Activité créée avec succès !');
                        setTimeout(() => {
                            window.location.href = '/admin/activities.html';
                        }, 1500);
                    } else {
                        showErrorMessage(data.message || 'Erreur lors de la création de l\'activité');
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    showErrorMessage('Erreur de connexion. Veuillez réessayer.');
                })
                .finally(() => {
                    // Réactiver le bouton
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                });
        });

        function clearFormErrors() {
            const errorElements = document.querySelectorAll('.form-error');
            errorElements.forEach(el => el.textContent = '');
        }

        function showSuccessMessage(message) {
            const notification = document.createElement('div');
            notification.className = 'notification notification-success';
            notification.innerHTML = `
                <div class="notification-content">
                    <i class="fas fa-check-circle"></i>
                    <span>${message}</span>
                </div>
            `;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: var(--success);
                color: white;
                border-radius: 12px;
                padding: 1rem;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
                z-index: 10000;
                display: flex;
                align-items: center;
                gap: 1rem;
                min-width: 300px;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            `;

            document.body.appendChild(notification);
            setTimeout(() => notification.style.transform = 'translateX(0)', 100);
            setTimeout(() => notification.remove(), 3000);
        }

        function showErrorMessage(message) {
            const notification = document.createElement('div');
            notification.className = 'notification notification-error';
            notification.innerHTML = `
                <div class="notification-content">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>${message}</span>
                </div>
            `;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: var(--danger);
                color: white;
                border-radius: 12px;
                padding: 1rem;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
                z-index: 10000;
                display: flex;
                align-items: center;
                gap: 1rem;
                min-width: 300px;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            `;

            document.body.appendChild(notification);
            setTimeout(() => notification.style.transform = 'translateX(0)', 100);
            setTimeout(() => notification.remove(), 5000);
        }
    </script>
</body>

</html>
