<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3B82F6">
    <title>CRATECH - Dashboard Employé</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-section">
                    <div class="logo-icon">C</div>
                    <span class="logo-text">CRATECH</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3 class="nav-section-title">Mon Espace</h3>
                    <a href="#dashboard" class="nav-item active">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Compte Rendu d'Activité</span>
                    </a>
                </div>

                <div class="nav-section">
                    <h3 class="nav-section-title">Historique</h3>
                    <a href="/employe/mes-cra.html" class="nav-item">
                        <i class="fas fa-history"></i>
                        <span>Mes CRA</span>
                    </a>
                </div>

                <div class="nav-section">
                    <h3 class="nav-section-title">Compte</h3>
                    <a href="/account.html" class="nav-item">
                        <i class="fas fa-user-cog"></i>
                        <span>Mon Compte</span>
                    </a>
                    <a href="/logout" class="nav-item">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Déconnexion</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">Compte Rendu d'Activité</h1>
                </div>
                <div class="header-right">
                    <div class="current-time">
                        <i class="fas fa-clock"></i>
                        <span id="current-time"></span>
                    </div>
                    <div class="user-menu">
                        <button class="user-menu-trigger">
                            <div class="user-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <span class="user-name" id="headerUserName">Employé</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- CRA Content -->
            <div class="cra-content" id="craContent">
                <!-- Header Card -->
                <div class="cra-header-card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i class="fas fa-calendar-alt"></i>
                            Compte Rendu d'Activité
                        </h2>
                        <div class="cra-controls">
                            <button class="nav-btn" id="prevMonth">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <div class="month-year-selector">
                                <select class="form-select" id="monthSelect">
                                    <!-- Month options will be populated dynamically -->
                                </select>
                                <select class="form-select" id="yearSelect">
                                <!-- Years will be populated dynamically -->
                            </select>
                            </div>
                            <button class="nav-btn" id="nextMonth">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>


                <!-- CRA Table Card -->
                <div class="calendar-card">
                    <div class="cra-table-container">
                        <table id="craTable" class="cra-table">
                            <thead>
                                <tr id="craTableHeader">
                                    <th class="project-header">Projet</th>
                                    <!-- Days will be generated here -->
                                </tr>
                            </thead>
                            <tbody id="craTableBody">
                                <!-- Project rows will be generated here -->
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="cra-actions">
                        <button class="btn btn-secondary btn-lg" id="exportCRA">
                            <i class="fas fa-download"></i>
                            Exporter
                        </button>
                        <button class="btn btn-primary btn-lg" id="submitCRA">
                            <i class="fas fa-paper-plane"></i>
                            Soumettre le CRA
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Modal for day value selection -->
        <div id="dayValueModal" class="modal" style="display: none;">
            <div class="modal-content modal-compact">
                <div class="value-options-compact">
                    <button class="value-option-compact" data-value="0">0</button>
                    <button class="value-option-compact" data-value="0.5">0.5</button>
                    <button class="value-option-compact" data-value="1">1</button>
                </div>
            </div>
        </div>

        <input type="hidden" id="csrf-token" value="">

        <script src="/js/admin.js"></script>
        <script src="/js/employe.js"></script>
    </body>
</html>
