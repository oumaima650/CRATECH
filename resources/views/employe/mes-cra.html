<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3B82F6">
    <title>CRATECH - Mes CRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-section">
                    <div class="logo-icon">C</div>
                    <span class="logo-text">CRATECH</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3 class="nav-section-title">Mon Espace</h3>
                    <a href="/employe/dashboard.html" class="nav-item">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Compte Rendu d'Activité</span>
                    </a>
                </div>

                <div class="nav-section">
                    <h3 class="nav-section-title">Historique</h3>
                    <a href="/employe/mes-cra.html" class="nav-item active">
                        <i class="fas fa-history"></i>
                        <span>Mes CRA</span>
                    </a>
                </div>

                <div class="nav-section">
                    <h3 class="nav-section-title">Compte</h3>
                    <a href="/account.html" class="nav-item">
                        <i class="fas fa-user-cog"></i>
                        <span>Mon Compte</span>
                    </a>
                    <a href="/logout" class="nav-item">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Déconnexion</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb">
                        <i class="fas fa-history"></i>
                        <span>Mes CRA</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="current-time">
                        <i class="fas fa-clock"></i>
                        <span id="current-time"></span>
                    </div>
                    <div class="user-menu">
                        <button class="user-menu-trigger">
                            <div class="user-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <span class="user-name" id="headerUserName">Employé</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Mes CRA Content -->
            <div class="mes-cra-content">
                <div class="cra-header-card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i class="fas fa-history"></i>
                            Mes CRA
                        </h2>
                        <a href="/employe/dashboard.html" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i>
                            Retour au CRA
                        </a>
                    </div>
                </div>

                <div class="cra-list-card">
                    <div class="cra-list-container">
                        <div class="loading-spinner" id="craListLoading" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i>
                            Chargement des CRA...
                        </div>
                        <div class="cra-list" id="craList">
                            <!-- CRA list will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <input type="hidden" id="csrf-token" value="">

    <script src="/js/admin.js"></script>
    <script src="/js/mes-cra.js"></script>
</body>
</html>
