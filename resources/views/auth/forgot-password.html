<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - CRATECH</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/auth.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Logo et titre -->
            <div class="text-center">
                <div class="mx-auto h-20 w-20 bg-gradient-to-r from-purple-500 to-blue-600 rounded-2xl flex items-center justify-center mb-4">
                    <i class="fas fa-cube text-white text-3xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">CRATECH</h2>
                <p class="text-gray-600">Mot de passe oublié</p>
            </div>

            <!-- Formulaire de mot de passe oublié -->
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <div id="success-message" class="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg hidden">
                    <p id="success-text"></p>
                </div>

                <div id="error-message" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg hidden">
                    <p id="error-text"></p>
                </div>

                <form class="space-y-6" id="forgot-password-form">
                    <div class="text-center mb-6">
                        <i class="fas fa-lock-open text-4xl text-purple-500 mb-4"></i>
                        <p class="text-gray-600">Entrez votre adresse email pour recevoir un lien de réinitialisation</p>
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-envelope text-purple-500 mr-2"></i>
                            Adresse email
                        </label>
                        <input id="email" name="email" type="email" required 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                               placeholder="votre@email.com">
                    </div>

                    <!-- Bouton de soumission -->
                    <button type="submit" 
                            class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-3 px-4 rounded-lg font-medium hover:from-purple-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 transition duration-200 transform hover:scale-105">
                        <i class="fas fa-paper-plane mr-2"></i>
                        Envoyer le lien
                    </button>
                </form>

                <!-- Liens de navigation -->
                <div class="mt-6 text-center space-y-2">
                    <p class="text-sm text-gray-600">
                        <a href="/login" class="font-medium text-purple-600 hover:text-purple-500 transition duration-200">
                            <i class="fas fa-arrow-left mr-1"></i>
                            Retour à la connexion
                        </a>
                    </p>
                    <p class="text-sm text-gray-600">
                        Pas encore de compte ? 
                        <a href="/register" class="font-medium text-purple-600 hover:text-purple-500 transition duration-200">
                            Créer un compte
                        </a>
                    </p>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center text-sm text-gray-500">
                <p>&copy; 2025 CRATECH. Tous droits réservés.</p>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        // Animation d'entrée
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('.bg-white');
            form.style.opacity = '0';
            form.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                form.style.transition = 'all 0.6s ease-out';
                form.style.opacity = '1';
                form.style.transform = 'translateY(0)';
            }, 100);
        });

        // Gestion du formulaire de mot de passe oublié
        document.getElementById('forgot-password-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const successDiv = document.getElementById('success-message');
            const errorDiv = document.getElementById('error-message');
            const successText = document.getElementById('success-text');
            const errorText = document.getElementById('error-text');
            
            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '',
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    successText.textContent = data.message || 'Lien de réinitialisation envoyé avec succès !';
                    successDiv.classList.remove('hidden');
                    errorDiv.classList.add('hidden');
                    
                    // Vider le formulaire
                    document.getElementById('email').value = '';
                } else {
                    errorText.textContent = data.message || 'Erreur lors de l\'envoi du lien.';
                    errorDiv.classList.remove('hidden');
                    successDiv.classList.add('hidden');
                }
            } catch (error) {
                errorText.textContent = 'Erreur de connexion au serveur.';
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
