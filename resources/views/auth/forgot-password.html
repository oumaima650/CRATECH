<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - CRATECH</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/auth.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Logo et titre -->
            <div class="text-center">
                 <div class="sidebar-header">
                <div class="logo-section">
                    <div class="logo-icon">C</div>
                    <span class="logo-text">CRATECH</span>
                </div>
                <p class="text-gray-600">Mot de passe oublié</p>
            </div>

            <!-- Formulaire de mot de passe oublié -->
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <div id="success-message" class="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg hidden">
                    <p id="success-text"></p>
                </div>

                <div id="error-message" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg hidden">
                    <p id="error-text"></p>
                </div>

                <form class="space-y-6" id="forgot-password-form">
                    <div class="text-center mb-6">
                        <i class="fas fa-lock-open text-4xl text-purple-500 mb-4"></i>
                        <p class="text-gray-600">Entrez votre identifiant et votre adresse email pour recevoir un code à 6 chiffres</p>
                    </div>

                    <!-- ID utilisateur -->
                    <div>
                        <label for="id_user" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-id-badge text-purple-500 mr-2"></i>
                            Identifiant (ID utilisateur)
                        </label>
                        <input id="id_user" name="id_user" type="number" required 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                               placeholder="123">
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-envelope text-purple-500 mr-2"></i>
                            Adresse email
                        </label>
                        <input id="email" name="email" type="email" required 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                               placeholder="votre@email.com">
                    </div>

                    <button id="btnSendCode" type="submit" 
                            class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-3 px-4 rounded-lg font-medium hover:from-purple-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 transition duration-200 transform hover:scale-105">
                        <i class="fas fa-paper-plane mr-2"></i>
                        Envoyer le code
                    </button>
                </form>

                <!-- Étape 2: Vérification du code et nouveau mot de passe -->
                <form class="space-y-6 hidden" id="verify-code-form">
                    <div class="text-center mb-6">
                        <i class="fas fa-key text-4xl text-purple-500 mb-4"></i>
                        <p class="text-gray-600">Saisissez le code reçu et définissez votre nouveau mot de passe</p>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label for="code" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-shield-alt text-purple-500 mr-2"></i>
                                Code à 6 chiffres
                            </label>
                            <input id="code" name="code" type="text" inputmode="numeric" pattern="\\d{6}" maxlength="6" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                   placeholder="000000">
                        </div>

                        <div>
                            <label for="new_password" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-lock text-purple-500 mr-2"></i>
                                Nouveau mot de passe
                            </label>
                            <input id="new_password" name="password" type="password" minlength="8" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                   placeholder="Au moins 8 caractères">
                        </div>

                        <div>
                            <label for="new_password_confirmation" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-lock text-purple-500 mr-2"></i>
                                Confirmez le nouveau mot de passe
                            </label>
                            <input id="new_password_confirmation" name="password_confirmation" type="password" minlength="8" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                   placeholder="Répétez le mot de passe">
                        </div>
                    </div>

                    <button id="btnConfirmReset" type="submit" 
                            class="w-full bg-green-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition duration-200 transform hover:scale-105">
                        <i class="fas fa-check mr-2"></i>
                        Valider et se connecter
                    </button>

                    <button id="btnBack" type="button" 
                            class="w-full mt-2 bg-gray-100 text-gray-800 py-3 px-4 rounded-lg font-medium hover:bg-gray-200 transition duration-200">
                        Retour
                    </button>
                </form>

                <!-- Liens de navigation -->
                <div class="mt-6 text-center space-y-2">
                    <p class="text-sm text-gray-600">
                        <a href="/login" class="font-medium text-purple-600 hover:text-purple-500 transition duration-200">
                            <i class="fas fa-arrow-left mr-1"></i>
                            Retour à la connexion
                        </a>
                    </p>
                    <p class="text-sm text-gray-600">
                        Pas encore de compte ? 
                        <a href="/register" class="font-medium text-purple-600 hover:text-purple-500 transition duration-200">
                            Créer un compte
                        </a>
                    </p>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center text-sm text-gray-500">
                <p>&copy; 2025 CRATECH. Tous droits réservés.</p>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        // Animation d'entrée
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('.bg-white');
            form.style.opacity = '0';
            form.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                form.style.transition = 'all 0.6s ease-out';
                form.style.opacity = '1';
                form.style.transform = 'translateY(0)';
            }, 100);
        });

        // Étape 1: envoi du code
        const step1Form = document.getElementById('forgot-password-form');
        const step2Form = document.getElementById('verify-code-form');
        const successDiv = document.getElementById('success-message');
        const errorDiv = document.getElementById('error-message');
        const successText = document.getElementById('success-text');
        const errorText = document.getElementById('error-text');

        step1Form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const id_user = document.getElementById('id_user').value.trim();
            const email = document.getElementById('email').value.trim();

            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]').getAttribute('content') || '',
                    },
                    body: JSON.stringify({ id_user, email })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    successText.textContent = data.message || 'Code envoyé.';
                    successDiv.classList.remove('hidden');
                    errorDiv.classList.add('hidden');

                    // Passer à l'étape 2 sans perdre id/email
                    step1Form.classList.add('hidden');
                    step2Form.classList.remove('hidden');
                    step2Form.dataset.id = id_user;
                    step2Form.dataset.email = email;
                } else {
                    errorText.textContent = data.message || "Vérifiez l'identifiant et l'email.";
                    errorDiv.classList.remove('hidden');
                    successDiv.classList.add('hidden');
                }
            } catch (error) {
                errorText.textContent = 'Erreur de connexion au serveur.';
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
            }
        });

        // Étape 2: vérification + reset
        step2Form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();
            const password = document.getElementById('new_password').value;
            const password_confirmation = document.getElementById('new_password_confirmation').value;
            const id_user = step2Form.dataset.id;
            const email = step2Form.dataset.email;

            if (password.length < 8) {
                errorText.textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
                return;
            }
            if (password !== password_confirmation) {
                errorText.textContent = 'Les mots de passe ne correspondent pas.';
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
                return;
            }

            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]').getAttribute('content') || '',
                    },
                    body: JSON.stringify({ id_user, email, code, password, password_confirmation })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    successText.textContent = data.message || 'Mot de passe mis à jour.';
                    successDiv.classList.remove('hidden');
                    errorDiv.classList.add('hidden');

                    // Redirection automatique
                    const redirect = data.redirect || '/login';
                    setTimeout(() => { window.location.href = redirect; }, 1200);
                } else {
                    errorText.textContent = data.message || 'Code invalide ou erreur lors de la mise à jour.';
                    errorDiv.classList.remove('hidden');
                    successDiv.classList.add('hidden');
                }
            } catch (error) {
                errorText.textContent = 'Erreur de connexion au serveur.';
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
            }
        });

        // Retour à l'étape 1
        document.getElementById('btnBack').addEventListener('click', function(){
            step2Form.classList.add('hidden');
            step1Form.classList.remove('hidden');
            document.getElementById('code').value = '';
            document.getElementById('new_password').value = '';
            document.getElementById('new_password_confirmation').value = '';
        });
    </script>
</body>
</html>
